  - check_id: DQ_REF_008
    name: "identidade resolvida para a populacao da aquisicao"
    dimension: "Referential Integrity"
    severity: CRITICAL
    finding_class: IDENTIDADE_NAO_RESOLVIDA
    dataset: VIVAMARKET_LEGACY.employee_master
    expectation: expect_identity_resolved
    column: COD_FUNC
    identity_system: VIVAMARKET_LEGACY
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    detects_defects: [D05, D06]
    note: >
      Reprova de proposito e com folga. A aquisicao veio sem identificador
      corporativo, entao nenhum vinculo sai por identificador exato e o
      ADR-0004 proibe promover match por nome. A consequencia desejada e que os
      KPIs recortados por essa populacao percam confianca por IDENTIDADE e nao
      por erro de dado: a distincao aparece no trust score (ADR-0022).
    consumed_by_kpis: [headcount, turnover_rate, compa_ratio]

  - check_id: DQ_REF_009
    name: "identidade resolvida para a populacao da folha"
    dimension: "Referential Integrity"
    severity: WARNING
    finding_class: IDENTIDADE_NAO_RESOLVIDA
    dataset: PAYROLL_BR.payroll_headcount_snapshot
    expectation: expect_identity_resolved
    column: matricula_folha
    identity_system: PAYROLL_BR
    threshold: {max_failure_rate: 0.65}
    threshold_basis: derivado
    note: >
      `has_enterprise_employee_id: partial` em sources.yaml, preenchido so a
      partir de 2020. Parte da populacao da folha, alem disso, nao tem
      contraparte no HRIS por definicao: terceiro e estagiario de agencia. O
      limiar mede exposicao esperada, nao qualidade.
    consumed_by_kpis: [compa_ratio, pay_gap]

  - check_id: DQ_REF_010
    name: "candidato do ATS com identidade resolvida"
    dimension: "Referential Integrity"
    severity: WARNING
    finding_class: IDENTIDADE_NAO_RESOLVIDA
    dataset: ATS_CLOUD.application
    expectation: expect_identity_resolved
    column: candidate_id
    identity_system: ATS_CLOUD
    threshold: {max_failure_rate: 0.97}
    threshold_basis: provisional
    detects_defects: [D15]
    note: >
      A chave e `candidate_id`, nao `employee_id`: o xref indexa o ATS pelo
      identificador de candidato, porque a maior parte das candidaturas nunca
      teve employee_id. A primeira versao deste check apontava para
      `employee_id` e reportava 100% de nao resolvido, numero plausivel para um
      sistema de identidade fraca e por isso dificil de questionar (achado 2 da
      F5). A maior parte dos candidatos legitimamente nunca virou colaborador,
      entao este numero mede exposicao e nao erro.
    consumed_by_kpis: [time_to_hire, offer_acceptance_rate]

  - check_id: DQ_REF_011
    name: "evento de remuneracao aponta para matricula conhecida na folha"
