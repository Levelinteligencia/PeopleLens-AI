    reference_column: matricula_folha
    threshold: {max_failure_rate: 0.02}
    threshold_basis: provisional
    consumed_by_kpis: [compa_ratio, pay_gap]

  - check_id: DQ_REF_012
    name: "gestor da aquisicao existe no universo de identidades"
    dimension: "Referential Integrity"
    severity: WARNING
    finding_class: IDENTIDADE_NAO_RESOLVIDA
    dataset: VIVAMARKET_LEGACY.employee_master
    expectation: expect_column_values_to_be_in_reference
    column: GESTOR
    reference_dataset: CONFORMED.identity
    reference_column: employee_id
    threshold: {max_failure_rate: 1.0}
    threshold_basis: provisional
    detects_defects: [D09]
    note: >
      sources.yaml diz, na personalidade do sistema, que a planilha tem
      "gestores que nao existem na NOVAORA". Isso e o mundo, nao defeito de
      carga, e o check mede o tamanho da exposicao em vez de reprovar.
    consumed_by_kpis: [span_of_control]

