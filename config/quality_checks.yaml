  - check_id: DQ_REF_002
    name: "gestor do legado existe no universo de identidades conformadas"
    dimension: "Referential Integrity"
    severity: CRITICAL
    finding_class: INVALIDO
    dataset: HRIS_LEGACY.employee_master
    expectation: expect_column_values_to_be_in_reference
    column: GESTOR
    reference_dataset: CONFORMED.identity
    reference_column: employee_id
    threshold: {max_failure_rate: 0.03}
    threshold_basis: derivado
    detects_defects: [D09]
    note: >
