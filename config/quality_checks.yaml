# =============================================================================
# PeopleLens AI  ::  NOVAORA
# config/quality_checks.yaml
#
# Catalogo de checks de Data Quality. Runner proprio (ADR-0013), checks
# declarados aqui e nunca em codigo.
#
# Tres atributos governam cada check, e eles respondem perguntas diferentes:
#
#   threshold       QUANDO o check reprova
#   severity        O QUE acontece com a linha reprovada (ADR-0010)
#   finding_class   QUE NATUREZA tem o problema encontrado (ADR-0022)
#
# A terceira e a novidade da F5, e existe porque "fail" nao e uma coisa so. Um
# salario negativo e um departamento sem mapeamento aprovado sao os dois fail, e
# sao problemas de natureza diferente: o primeiro e dado errado, o segundo e
# decisao pendente. Somar os dois num numero de confianca apaga justamente a
# distincao que quem usa o numero precisa para saber o que fazer.
#
#   severity: BLOCKER   linha vai para quarentena e nao entra no analitico
#             CRITICAL  linha entra e o check derruba o trust score do KPI
#             WARNING   registra e monitora, nao afeta trust score
#             INFO      apenas observabilidade
#
# `threshold_basis` diz DE ONDE veio o limiar. Limiar sem base declarada e
# palpite, e palpite que ninguem marcou como palpite vira fato em tres meses.
#
#   invariante  0.0 estrutural: chave duplicada, saida antes da entrada
#   derivado    calculado de defects.yaml, sources.yaml ou generation.yaml
#   provisional palpite fundamentado, a calibrar na F7 junto com o trust score
#
# `consumed_by_kpis` e o campo que o ADR-0011 exige. Na F5 ele passa a ser
# consumido de verdade: os contratos em `config/kpis/` declaram
# `depends_on_checks` e o teste de check orfao esta ativo.
#
# Status: F5. Catalogo completo dos sistemas da onda 1.
# =============================================================================

meta:
  config_version: "0.2"
  phase: F5
  scope: "catalogo completo da onda 1; a onda 2 entra com os sistemas dela"
  thresholds_status: PROVISIONAL
  threshold_calibration_phase: F7
  thresholds_decision: "DQ-02, aprovada no fechamento da F5"
  note: >
    Os limiares marcados como `provisional` nao foram ajustados para fazer
    check passar. Varios reprovam de proposito, e a lista de reprovados e
    entrega da fase, nao defeito dela.

    DQ-02 (fechamento da F5): os 20 limiares provisionais NAO sao congelados
    nesta fase. A calibragem definitiva acontece na F7, usando o comportamento
    dos KPIs e a distribuicao de trust score como criterio de validacao de
    negocio, e nao a taxa de aprovacao dos checks. Congelar agora fixaria
    palpite como norma antes de existir evidencia para julga-lo.

severity_effects:
  BLOCKER:  "quarentena"
  CRITICAL: "entra, derruba trust score"
  WARNING:  "monitora"
  INFO:     "observabilidade"

# -----------------------------------------------------------------------------
# Classes de achado (ADR-0022). Taxonomia OFICIAL do PeopleLens.
#
# As cinco primeiras vieram do principio que a Sam fixou na abertura da F5.
# `DESATUALIZADO` e `DIVERGENCIA` foram propostas durante a implementacao,
# porque os checks de Timeliness e de Reconciliation nao cabiam nas cinco sem
# distorcao, e foram aprovadas em DQ-03 no fechamento da fase.
#
# A regra que as separa: nem tudo que nao esta resolvido esta errado. Um valor
# sem mapeamento aprovado nao e invalido; e um valor legitimo na origem
# esperando uma decisao. Confundir os dois faz o sistema tratar fila de
# trabalho como defeito de dado, e leva a "corrigir" o que nao esta quebrado.
# -----------------------------------------------------------------------------
finding_classes:
  INVALIDO:
    description: "o valor viola uma regra e esta errado"
    is_pendency: false
    example: "salario negativo, desligamento anterior a admissao, chave duplicada"
  NAO_MAPEADO:
    description: "valor legitimo na origem, sem mapeamento aprovado no dominio corporativo"
    is_pendency: true
    example: "`Mktg` no cadastro legado, sem linha aprovada em ref_department_mapping"
  DECISAO_PENDENTE:
    description: "existe decisao de negocio em aberto; nao ha resposta tecnica correta"
    is_pendency: true
    example: "`N4` da VivaMarket, que cobre IC4 e M1 da NOVAORA"
  IDENTIDADE_NAO_RESOLVIDA:
    description: "a pessoa existe, o vinculo entre sistemas nao foi estabelecido"
    is_pendency: true
    example: "pessoa da folha sem contraparte confirmada no HRIS corporativo"
  AUSENCIA_LEGITIMA:
    description: "o campo nao existia na epoca, ou nao declarar e opcao da pessoa"
    is_pendency: true
    example: "raca e cor antes de jun/2019, ou nao declaracao depois"
  DIVERGENCIA:
    approved_in: "DQ-03, fechamento da F5"
    description: "duas leituras ou duas fontes discordam; nenhuma esta necessariamente errada"
    is_pendency: false
    example: "HRIS e folha com headcount diferente, por definicao diferente de ativo"
  DESATUALIZADO:
    approved_in: "DQ-03, fechamento da F5"
    description: "o dado existe na fonte e nao chegou, ou chegou com atraso"
    is_pendency: true
    example: "snapshot mensal com buraco de tres meses no meio da serie"

checks:

  # ===========================================================================
  # COMPLETENESS
  # ===========================================================================
  - check_id: DQ_COMP_001
    name: "employee_id presente no cadastro do HRIS corporativo"
    dimension: Completeness
    severity: BLOCKER
    finding_class: INVALIDO
    dataset: HRIS_CORE.employee_master
    expectation: expect_column_values_to_not_be_null
    column: employee_id
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    detects_defects: [D05]
    consumed_by_kpis: [headcount, fte, turnover_rate, gender_representation,
                       black_representation, pcd_representation]

  - check_id: DQ_COMP_002
    name: "identificador de origem presente na aquisicao"
    dimension: Completeness
    severity: BLOCKER
    finding_class: INVALIDO
    dataset: VIVAMARKET_LEGACY.employee_master
    expectation: expect_column_values_to_not_be_null
    column: COD_FUNC
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    detects_defects: [D05]
    consumed_by_kpis: [headcount]

  - check_id: DQ_COMP_003
    name: "data de admissao presente no cadastro legado"
    dimension: Completeness
    severity: BLOCKER
    finding_class: INVALIDO
    dataset: HRIS_LEGACY.employee_master
    expectation: expect_column_values_to_not_be_null
    column: DT_ADMISSAO
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    consumed_by_kpis: [headcount, turnover_rate, tenure]

  - check_id: DQ_COMP_004
    name: "data de admissao presente no HRIS corporativo"
    dimension: Completeness
    severity: BLOCKER
    finding_class: INVALIDO
    dataset: HRIS_CORE.employee_master
    expectation: expect_column_values_to_not_be_null
    column: hire_date
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    consumed_by_kpis: [headcount, turnover_rate, tenure]

  - check_id: DQ_COMP_005
    name: "matricula presente no cadastro legado"
    dimension: Completeness
    severity: BLOCKER
    finding_class: INVALIDO
    dataset: HRIS_LEGACY.employee_master
    expectation: expect_column_values_to_not_be_null
    column: MATRICULA
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    consumed_by_kpis: [headcount]

  - check_id: DQ_COMP_006
    name: "employee_id presente em todo snapshot corporativo"
    dimension: Completeness
    severity: BLOCKER
    finding_class: INVALIDO
    dataset: HRIS_CORE.headcount_snapshot
    expectation: expect_column_values_to_not_be_null
    column: employee_id
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    consumed_by_kpis: [headcount, fte]

  - check_id: DQ_COMP_007
    name: "departamento presente no cadastro corporativo"
    dimension: Completeness
    severity: CRITICAL
    finding_class: INVALIDO
    dataset: HRIS_CORE.employee_master
    expectation: expect_column_values_to_not_be_null
    column: department
    threshold: {max_failure_rate: 0.02}
    threshold_basis: provisional
    detects_defects: [D04]
    consumed_by_kpis: [headcount, turnover_rate, internal_mobility_rate]

  - check_id: DQ_COMP_008
    name: "taxa de nao declaracao de raca e cor dentro do esperado"
    dimension: Completeness
    severity: WARNING
    finding_class: AUSENCIA_LEGITIMA
    dataset: HRIS_CORE.employee_master
    expectation: expect_column_values_to_not_be_null
    column: race_ethnicity
    threshold: {max_failure_rate: 0.45}
    threshold_basis: derivado
    detects_defects: [D02, D03]
    note: >
      Nao declarar e opcao legitima, nao erro, e antes de jun/2019 o campo nem
      existia. O check existe para que a taxa seja acompanhada e reportada
      junto do KPI, nunca para forcar preenchimento. Limiar derivado das taxas
      de nao declaracao por pais em generation.yaml.
    consumed_by_kpis: [black_representation, pcd_representation]

  - check_id: DQ_COMP_009
    name: "taxa de nao declaracao de deficiencia dentro do esperado"
    dimension: Completeness
    severity: WARNING
    finding_class: AUSENCIA_LEGITIMA
    dataset: HRIS_CORE.employee_master
    expectation: expect_column_values_to_not_be_null
    column: disability_flag
    threshold: {max_failure_rate: 0.45}
    threshold_basis: derivado
    detects_defects: [D02, D03]
    consumed_by_kpis: [pcd_representation]

  - check_id: DQ_COMP_010
    name: "nome presente no cadastro legado"
    dimension: Completeness
    severity: CRITICAL
    finding_class: INVALIDO
    dataset: HRIS_LEGACY.employee_master
    expectation: expect_column_values_to_not_be_null
    column: NOME
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    note: "Nome e insumo da resolucao de identidade por nome (ADR-0004)."
    consumed_by_kpis: [headcount]

  - check_id: DQ_COMP_011
    name: "moeda presente na folha"
    dimension: Completeness
    severity: CRITICAL
    finding_class: INVALIDO
    dataset: PAYROLL_BR.compensation
    expectation: expect_column_values_to_not_be_null
    column: moeda
    threshold: {max_failure_rate: 0.02}
    threshold_basis: derivado
    detects_defects: [D14]
    consumed_by_kpis: [compa_ratio, pay_gap]

  - check_id: DQ_COMP_012
    name: "centro de custo presente no snapshot da folha"
    dimension: Completeness
    severity: WARNING
    finding_class: INVALIDO
    dataset: PAYROLL_BR.payroll_headcount_snapshot
    expectation: expect_column_values_to_not_be_null
    column: centro_custo
    threshold: {max_failure_rate: 0.05}
    threshold_basis: provisional
    decision: "DQ-01, fechamento da F5"
    note: >
      Reprova em 100% e continua reprovando por decisao. A coluna esta
      declarada em sources.yaml e em standardization.yaml, foi perfilada desde
      a F3, e nunca carregou um unico valor.

      DQ-01: manter o campo exatamente como veio do RAW. Nao alterar o gerador,
      nao imputar, nao remover a coluna da declaracao. O check permanece como
      finding de completude permanente, e o impacto sobre KPIs esta em
      docs/f5_completeness_gaps.md.

      O que isso custa, em uma linha: o centro de custo EXISTE e esta completo
      nos dois HRIS, entao recortar headcount por centro de custo continua
      possivel. O que fica impossivel e atribuir VALOR da folha a centro de
      custo, porque a chave de atribuicao so existe do lado do HRIS.
    consumed_by_kpis: [headcount]

  - check_id: DQ_COMP_013
    name: "e-mail presente na candidatura"
    dimension: Completeness
    severity: CRITICAL
    finding_class: INVALIDO
    dataset: ATS_CLOUD.application
    expectation: expect_column_values_to_not_be_null
    column: candidate_email
    threshold: {max_failure_rate: 0.05}
    threshold_basis: provisional
    detects_defects: [D15]
    note: "E-mail e a unica chave de ligacao entre candidato e colaborador."
    consumed_by_kpis: [time_to_hire, offer_acceptance_rate]

  - check_id: DQ_COMP_014
    name: "nivel presente no cadastro corporativo"
    dimension: Completeness
    severity: BLOCKER
    finding_class: INVALIDO
    dataset: HRIS_CORE.employee_master
    expectation: expect_column_values_to_not_be_null
    column: job_level
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    consumed_by_kpis: [women_in_leadership, promotion_rate, span_of_control]

  - check_id: DQ_COMP_015
    name: "departamento nao e marcador de vazio disfarcado de valor"
    dimension: Completeness
    severity: CRITICAL
    finding_class: INVALIDO
    dataset: HRIS_LEGACY.employee_master
    expectation: expect_column_values_to_not_be_in_set
    column: DEPARTAMENTO
    value_set: ["N/A", "NA", "-", "--", ".", "NULL", "SEM INFO", "SEM INFORMACAO", "0", "0000"]
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    note: >
      Marcador de vazio e pior que nulo: passa em check de completude, entra no
      DE/PARA e vira categoria no grafico. A padronizacao converte vazio em
      nulo e nao pode converter `N/A`, porque isso seria inventar significado.
    consumed_by_kpis: [headcount, turnover_rate]

  # ===========================================================================
  # VALIDITY
  # ===========================================================================
  - check_id: DQ_VALID_001
    name: "data de admissao convertida com sucesso no legado"
    dimension: Validity
    severity: BLOCKER
    finding_class: INVALIDO
    dataset: HRIS_LEGACY.employee_master
    expectation: expect_parse_ok
    column: DT_ADMISSAO
    threshold: {max_failure_rate: 0.01}
    threshold_basis: derivado
    detects_defects: [D07, D08]
    consumed_by_kpis: [headcount, tenure]

  - check_id: DQ_VALID_002
    name: "data de admissao da aquisicao convertida com sucesso"
    dimension: Validity
    severity: BLOCKER
    finding_class: INVALIDO
    dataset: VIVAMARKET_LEGACY.employee_master
    expectation: expect_parse_ok
    column: DT_ADM
    threshold: {max_failure_rate: 0.01}
    threshold_basis: derivado
    detects_defects: [D07, D08]
    consumed_by_kpis: [headcount]

  - check_id: DQ_VALID_003
    name: "data de admissao sem ambiguidade entre dia e mes"
    dimension: Validity
    severity: WARNING
    finding_class: DIVERGENCIA
    dataset: HRIS_LEGACY.employee_master
    expectation: expect_not_ambiguous
    column: DT_ADMISSAO
    threshold: {max_failure_rate: 1.0}
    threshold_basis: provisional
    note: >
      A conversao usou o formato declarado pelo sistema. O check existe para
      tornar visivel quantos valores dependem dessa declaracao estar certa, e
      por isso o limiar e 1.0: ele mede exposicao, nao reprova.
    consumed_by_kpis: [headcount, tenure]

  - check_id: DQ_VALID_004
    name: "genero em dominio conhecido apos o DE/PARA, cadastro legado"
    dimension: Validity
    severity: CRITICAL
    finding_class: NAO_MAPEADO
    dataset: HRIS_LEGACY.employee_master
    expectation: expect_column_values_to_be_in_set
    column: std_gender
    value_set: [Male, Female, Non-binary, Not informed]
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    detects_defects: [D01]
    consumed_by_kpis: [gender_representation, women_in_leadership]

  - check_id: DQ_VALID_005
    name: "genero em dominio conhecido no HRIS corporativo"
    dimension: Validity
    severity: CRITICAL
    finding_class: NAO_MAPEADO
    dataset: HRIS_CORE.employee_master
    expectation: expect_column_values_to_be_in_set
    column: std_gender
    value_set: [Male, Female, Non-binary, Not informed]
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    detects_defects: [D01]
    consumed_by_kpis: [gender_representation, women_in_leadership]

  - check_id: DQ_VALID_006
    name: "job level em dominio corporativo apos o DE/PARA, aquisicao"
    dimension: Validity
    severity: CRITICAL
    finding_class: DECISAO_PENDENTE
    dataset: VIVAMARKET_LEGACY.employee_master
    expectation: expect_column_values_to_not_equal
    column: std_job_level
    value: UNMAPPED
    threshold: {max_failure_rate: 0.10}
    threshold_basis: provisional
    detects_defects: [D12]
    note: >
      Reprovado em 13,12% desde a F3, e o limiar nao foi alterado (decisao da
      Sam, F3 item 1). A classe e DECISAO_PENDENTE e nao NAO_MAPEADO porque
      `N4` e `N5` nao tem traducao correta: a escala da adquirida cobre dois
      niveis da NOVAORA por valor. Isso muda o efeito no trust score
      (ADR-0022): a perda vem de decisao em aberto, nao de dado errado.
    consumed_by_kpis: [women_in_leadership, promotion_rate, compa_ratio]

  - check_id: DQ_VALID_007
    name: "job level em dominio corporativo no HRIS corporativo"
    dimension: Validity
    severity: CRITICAL
    finding_class: NAO_MAPEADO
    dataset: HRIS_CORE.employee_master
    expectation: expect_column_values_to_be_in_set
    column: std_job_level
    value_set: [IC1, IC2, IC3, IC4, IC5, M1, M2, M3, M4, M5, D1, D2, D3]
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    consumed_by_kpis: [women_in_leadership, promotion_rate, span_of_control,
                       black_representation, gender_representation]

  - check_id: DQ_VALID_008
    name: "jornada entre 0 e 1 no cadastro legado"
    dimension: Validity
    severity: CRITICAL
    finding_class: INVALIDO
    dataset: HRIS_LEGACY.employee_master
    expectation: expect_column_values_to_be_between
    column: JORNADA__num
    min: 0.0
    max: 1.0
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    consumed_by_kpis: [fte]

  - check_id: DQ_VALID_009
    name: "texto sem marca de encoding quebrado"
    dimension: Validity
    severity: WARNING
    finding_class: INVALIDO
    dataset: HRIS_LEGACY.employee_master
    expectation: expect_column_values_to_not_match_regex
    column: NOME
    regex: "[ÃÂ][\\x80-\\xBF]"
    threshold: {max_failure_rate: 0.01}
    threshold_basis: derivado
    detects_defects: [D23]
    note: "Roda DEPOIS da padronizacao: o que sobrar aqui e dano que o reparo nao resolveu."
    consumed_by_kpis: [headcount]

  - check_id: DQ_VALID_010
    name: "salario positivo na folha"
    dimension: Validity
    severity: BLOCKER
    finding_class: INVALIDO
    dataset: PAYROLL_BR.compensation
    expectation: expect_column_values_to_be_between
    column: salario_base__num
    min: 0.01
    max: 100000000.0
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    consumed_by_kpis: [compa_ratio, pay_gap]

  - check_id: DQ_VALID_011
    name: "FTE entre 0,1 e 1 no cadastro corporativo"
    dimension: Validity
    severity: CRITICAL
    finding_class: INVALIDO
    dataset: HRIS_CORE.employee_master
    expectation: expect_column_values_to_be_between
    column: fte__num
    min: 0.1
    max: 1.0
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    consumed_by_kpis: [fte, headcount]

  - check_id: DQ_VALID_012
    name: "data de admissao dentro do horizonte plausivel"
    dimension: Validity
    severity: BLOCKER
    finding_class: INVALIDO
    dataset: HRIS_CORE.employee_master
    expectation: expect_date_between
    column: hire_date__iso
    min_date: "1980-01-01"
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    note: "Sem `max_date` declarado o limite superior e hoje: admissao no futuro e invalida."
    consumed_by_kpis: [headcount, tenure]

  - check_id: DQ_VALID_013
    name: "data de desligamento dentro do horizonte plausivel"
    dimension: Validity
    severity: CRITICAL
    finding_class: INVALIDO
    dataset: HRIS_CORE.employee_master
    expectation: expect_date_between
    column: termination_date__iso
    min_date: "1980-01-01"
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    consumed_by_kpis: [turnover_rate, tenure]

  - check_id: DQ_VALID_014
    name: "e-mail do candidato tem forma de e-mail"
    dimension: Validity
    severity: CRITICAL
    finding_class: INVALIDO
    dataset: ATS_CLOUD.application
    expectation: expect_column_values_to_match_regex
    column: candidate_email
    regex: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    threshold: {max_failure_rate: 0.05}
    threshold_basis: provisional
    detects_defects: [D15]
    consumed_by_kpis: [time_to_hire, offer_acceptance_rate]

  - check_id: DQ_VALID_015
    name: "sexo no dominio que o proprio sistema legado declara"
    dimension: Validity
    severity: WARNING
    finding_class: INVALIDO
    dataset: HRIS_LEGACY.employee_master
    expectation: expect_column_values_to_be_in_set
    column: SEXO
    value_set: ["M", "F"]
    threshold: {max_failure_rate: 0.10}
    threshold_basis: derivado
    detects_defects: [D01]
    note: >
      `gender_values` de HRIS_LEGACY em sources.yaml declara M e F. Valor fora
      disso e o sistema violando o proprio dominio declarado, que e diferente
      de um vocabulario alternativo legitimo: por isso INVALIDO aqui e
      NAO_MAPEADO no DQ_VALID_004.
    consumed_by_kpis: [gender_representation]

  - check_id: DQ_VALID_016
    name: "nota de performance em dominio conhecido apos o DE/PARA"
    dimension: Validity
    severity: CRITICAL
    finding_class: NAO_MAPEADO
    dataset: HRIS_CORE.performance
    expectation: expect_column_values_to_be_in_set
    column: std_performance_rating
    value_set: ["Below Expectations", "Developing", "Meets Expectations",
                "Exceeds Expectations", "Outstanding"]
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    note: >
      O DE/PARA deste campo tem vigencia: a escala virou textual em 2021. O
      check so passa se a vigencia estiver sendo respeitada (F4).
    consumed_by_kpis: [performance_distribution, promotion_rate]

  - check_id: DQ_VALID_017
    name: "salario positivo no cadastro da aquisicao"
    dimension: Validity
    severity: CRITICAL
    finding_class: INVALIDO
    dataset: VIVAMARKET_LEGACY.employee_master
    expectation: expect_column_values_to_be_between
    column: SALARIO__num
    min: 0.01
    max: 100000000.0
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    consumed_by_kpis: [compa_ratio]

  - check_id: DQ_VALID_018
    name: "nome com comprimento plausivel"
    dimension: Validity
    severity: WARNING
    finding_class: INVALIDO
    dataset: HRIS_CORE.employee_master
    expectation: expect_column_value_lengths_to_be_between
    column: full_name
    min_length: 3
    max_length: 120
    threshold: {max_failure_rate: 0.0}
