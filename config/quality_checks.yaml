    column: dt_competencia__iso
    max_gap_months: 1
    threshold: {max_failure_rate: 0.0}
    threshold_basis: invariante
    detects_defects: [D18]
    consumed_by_kpis: [headcount, compa_ratio]

  - check_id: DQ_TIME_005
    name: "sistema legado nao produz dado depois de desativado"
    dimension: Timeliness
    severity: WARNING
    finding_class: INVALIDO
    dataset: HRIS_LEGACY.headcount_snapshot
    expectation: expect_date_between
    column: DT_REFERENCIA__iso
    min_date: "2016-01-01"
    max_date: "2019-12-31"
    threshold: {max_failure_rate: 0.0}
    threshold_basis: derivado
    note: "sources.yaml declara `active_to: 2019-11-30` para HRIS_LEGACY."
    consumed_by_kpis: [headcount]

  - check_id: DQ_TIME_006
    name: "ATS chega ate o fim da serie"
    dimension: Timeliness
    severity: WARNING
    finding_class: DESATUALIZADO
    dataset: ATS_CLOUD.application
    expectation: expect_max_date_after
    column: application_date__iso
    min_date: "2026-04-01"
    threshold: {max_failure_rate: 0.0}
    threshold_basis: derivado
    consumed_by_kpis: [hiring_volume, time_to_hire]

  # ===========================================================================
  # RECONCILIATION
  # ===========================================================================
  - check_id: DQ_RECON_001
    name: "headcount BR do HRIS versus folha, na janela de sobreposicao"
    dimension: Reconciliation
    severity: CRITICAL
    finding_class: DIVERGENCIA
    dataset: HRIS_CORE.headcount_snapshot
    filter: {column: std_country, equals: BR}
    expectation: expect_row_count_ratio_between
    reference_dataset: PAYROLL_BR.payroll_headcount_snapshot
    reference_filter: {column: dt_competencia__iso, min: "2019-05-01"}
    min_ratio: 0.90
    max_ratio: 1.10
    threshold: {max_failure_rate: 0.0}
    threshold_basis: derivado
    detects_defects: [D11]
    note: >
      Os dois recortes existem por causa do achado 1 da F5. Sem eles o check
      comparava a empresa inteira (cinco paises, a partir de 2019) contra a
      folha brasileira (um pais, a partir de 2016), passava com razao 1,07 e
      nao estava medindo divergencia nenhuma: estava medindo diferenca de
      escopo. Com escopo igualado, a divergencia remanescente e a que o
      `population_rule` da folha em sources.yaml preve, porque a folha inclui
      terceiro, estagiario e aviso previo e exclui afastado longo.
    consumed_by_kpis: [headcount, fte]

  - check_id: DQ_RECON_002
    name: "headcount BR do HRIS versus folha, mes a mes"
    dimension: Reconciliation
    severity: CRITICAL
    finding_class: DIVERGENCIA
    dataset: HRIS_CORE.headcount_snapshot
    filter: {column: std_country, equals: BR}
    expectation: expect_group_count_ratio_between
    group_column: snapshot_date__iso
    reference_dataset: PAYROLL_BR.payroll_headcount_snapshot
    reference_group_column: dt_competencia__iso
    min_ratio: 0.85
    max_ratio: 1.15
    threshold: {max_failure_rate: 0.05}
    threshold_basis: provisional
    detects_defects: [D11]
    note: >
      Reconciliar so o total esconde duas coisas. Compensacao, primeiro: um mes
      20% acima e outro 20% abaixo fecham em zero. Diferenca de vigencia,
      depois: periodo em que so uma das fontes existe entra no total e dilui a
      razao. Aqui a taxa de falha e a fracao de MESES fora da faixa, e so
      entram meses que existem dos dois lados.
    consumed_by_kpis: [headcount, fte]

  - check_id: DQ_RECON_003
    name: "volume de candidaturas versus tamanho do cadastro"
    dimension: Reconciliation
    severity: WARNING
    finding_class: DIVERGENCIA
    dataset: ATS_CLOUD.application
    expectation: expect_row_count_ratio_between
    reference_dataset: HRIS_CORE.employee_master
    min_ratio: 0.05
    max_ratio: 20.0
    threshold: {max_failure_rate: 0.0}
    threshold_basis: provisional
    detects_defects: [D17]
    consumed_by_kpis: [hiring_volume, time_to_hire]

  - check_id: DQ_RECON_004
    name: "snapshot legado versus cadastro legado"
    dimension: Reconciliation
    severity: WARNING
    finding_class: DIVERGENCIA
    dataset: HRIS_LEGACY.headcount_snapshot
    expectation: expect_row_count_ratio_between
    reference_dataset: HRIS_LEGACY.employee_master
    min_ratio: 1.0
    max_ratio: 60.0
    threshold: {max_failure_rate: 0.0}
    threshold_basis: derivado
    note: "O snapshot e mensal e o cadastro tem uma linha por pessoa; a razao e o numero de meses."
    consumed_by_kpis: [headcount]

  - check_id: DQ_RECON_005
    name: "sobreposicao entre HRIS legado e corporativo durante a migracao"
    dimension: Reconciliation
    severity: WARNING
    finding_class: DIVERGENCIA
    dataset: HRIS_LEGACY.headcount_snapshot
    expectation: expect_group_count_ratio_between
    group_column: DT_REFERENCIA__iso
    reference_dataset: HRIS_CORE.headcount_snapshot
    reference_group_column: snapshot_date__iso
    min_ratio: 0.50
    max_ratio: 2.00
    threshold: {max_failure_rate: 0.35}
    threshold_basis: provisional
    detects_defects: [D10]
    note: >
      Os dois sistemas rodaram em paralelo por sete meses em 2019
      (`INC_2019_HRIS_MIGRATION`). Nos meses de sobreposicao deveriam descrever
      a mesma empresa, e o quanto nao descrevem e o custo da migracao.
    consumed_by_kpis: [headcount, turnover_rate]

  - check_id: DQ_RECON_006
    name: "eventos de remuneracao versus populacao da folha"
    dimension: Reconciliation
    severity: WARNING
    finding_class: DIVERGENCIA
    dataset: PAYROLL_BR.compensation
    expectation: expect_group_count_ratio_between
    group_column: dt_vigencia__iso
    reference_dataset: PAYROLL_BR.payroll_headcount_snapshot
    reference_group_column: dt_competencia__iso
    min_ratio: 0.0
    max_ratio: 0.50
    threshold: {max_failure_rate: 0.10}
    threshold_basis: provisional
    note: "Mudanca salarial e evento raro: mais de metade da populacao num mes e anomalia."
    consumed_by_kpis: [compa_ratio, pay_gap]

  - check_id: DQ_RECON_007
    name: "requisicoes versus candidaturas, mes a mes"
    dimension: Reconciliation
    severity: INFO
    finding_class: DIVERGENCIA
    dataset: ATS_CLOUD.requisition
    expectation: expect_group_count_ratio_between
    group_column: opening_date__iso
    reference_dataset: ATS_CLOUD.application
    reference_group_column: application_date__iso
    min_ratio: 0.01
    max_ratio: 1.0
    threshold: {max_failure_rate: 0.10}
    threshold_basis: provisional
    consumed_by_kpis: [hiring_volume, time_to_fill]

  - check_id: DQ_RECON_008
    name: "volume de avaliacoes versus populacao avaliavel"
    dimension: Reconciliation
    severity: INFO
    finding_class: DIVERGENCIA
    dataset: HRIS_CORE.performance
    expectation: expect_row_count_ratio_between
    reference_dataset: HRIS_CORE.employee_master
    min_ratio: 0.5
    max_ratio: 10.0
    threshold: {max_failure_rate: 0.0}
    threshold_basis: provisional
    consumed_by_kpis: [performance_distribution, promotion_rate]
