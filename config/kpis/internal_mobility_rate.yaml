# Contrato do KPI `internal_mobility_rate` (ADR-0011).
#
# `depends_on_checks` NAO e digitado: e derivado de `consumed_by_kpis` no
# catalogo de checks, e o teste test_contrato_de_kpi_bate_com_o_catalogo
# reprova se as duas pontas divergirem.
#
# `minimum_n` e a supressao do ADR-0007: abaixo dele o recorte nao responde,
# e a recusa e por privacidade, nao por qualidade.
#
# --- F7 ---------------------------------------------------------------------
# `status` e `certification` NAO sao calculaveis a partir do trust score
# (ADR-0029). CERTIFIED e aprovacao humana registrada, com dono e data.
# Promover porque o dado melhorou e o mesmo erro que a F4 proibe na promocao
# automatica de mapeamento.
#
# `interpretation_rules` vazio significa INTERPRETACAO BLOQUEADA. Nao preencher
# para destravar o nivel: sem banda ou meta assinada, nao ha o que interpretar.
kpi_id: internal_mobility_rate
name: Mobilidade interna
description: Movimentacoes internas sobre headcount medio.
business_definition: Movimentacoes internas de transferencia ou lateral sobre o headcount
  medio.
formula: movimentacoes de tipo transferencia ou lateral sobre headcount medio
grain: ano x business unit
population: pessoas ativas no periodo
period_grain: ano
period_rollup: null
period_coverage:
  from: '2016'
  to: '2026'
allowed_dimensions:
- pais
- business_unit
- departamento
- nivel
filters: []
exclusions: []
source_tables:
- fact_movement
- fact_headcount_snapshot
- dim_organization
- dim_calendar
coverage: null
owner: people-analytics
version: 1.0.0
status: BLOCKED
certification:
  approved_by: null
  approved_at: null
  blockers:
  - motivo: 'movement_type sem DE/PARA aprovado: dois vocabularios coexistem (Promotion 491
      e PROMOCAO 110, Transfer 480 e TRANSFERENCIA 92). O KPI daria 491 ou 601 conforme quem
      escreveu a consulta.'
    resolvido_por: DE/PARA governado de movement_type, aprovado na fila da F4 com responsavel
      e justificativa
depends_on_checks:
- DQ_COMP_007
- DQ_CONS_001
- DQ_REF_006
depends_on_mappings:
- ref_department_mapping
minimum_n: 20
response_levels:
  FATO: liberado
  CONTEXTO: liberado; associacao e sempre nomeada como associacao
  INTERPRETACAO: bloqueado ate haver regra registrada no contrato, com dono
  CAUSALIDADE: negado por padrao (ADR-0015); sem estudo registrado nao ha resposta causal
interpretation_rules: []
causal_studies: []
