# Contrato do KPI `turnover_rate` (ADR-0011).
#
# `depends_on_checks` NAO e digitado: e derivado de `consumed_by_kpis` no
# catalogo de checks, e o teste test_contrato_de_kpi_bate_com_o_catalogo
# reprova se as duas pontas divergirem.
#
# `minimum_n` e a supressao do ADR-0007: abaixo dele o recorte nao responde,
# e a recusa e por privacidade, nao por qualidade.
#
# --- F7 ---------------------------------------------------------------------
# `status` e `certification` NAO sao calculaveis a partir do trust score
# (ADR-0029). CERTIFIED e aprovacao humana registrada, com dono e data.
# Promover porque o dado melhorou e o mesmo erro que a F4 proibe na promocao
# automatica de mapeamento.
#
# `interpretation_rules` vazio significa INTERPRETACAO BLOQUEADA. Nao preencher
# para destravar o nivel: sem banda ou meta assinada, nao ha o que interpretar.
kpi_id: turnover_rate
name: Turnover
description: Desligamentos sobre headcount medio do periodo.
business_definition: Desligamentos no periodo sobre a media do headcount de inicio e fim do
  periodo.
formula: desligamentos no periodo dividido pela media do headcount de inicio e fim
grain: ano x pais x business unit
population: pessoas ativas no periodo, pelo sistema de registro
period_grain: ano
period_rollup: null
period_coverage:
  from: '2016'
  to: '2026'
allowed_dimensions:
- pais
- business_unit
- departamento
- nivel
- origem
filters:
- regra: is_system_of_record = true no denominador
  porque: mesmo motivo do headcount
exclusions:
- o_que: recorte por voluntariedade
  porque: nao ha motivo de desligamento na onda 1; voluntary_turnover NAO existe no catalogo
source_tables:
- dim_calendar
- dim_employee
- dim_job_level
- dim_organization
- dim_origin
- fact_headcount_snapshot
- fact_termination
coverage: null
owner: people-analytics
version: 1.0.0
status: CERTIFIED
certification:
  approved_by: people-analytics
  approved_at: '2026-09-12'
  blockers: []
depends_on_checks:
- DQ_COMP_001
- DQ_COMP_003
- DQ_COMP_004
- DQ_COMP_007
- DQ_COMP_015
- DQ_CONS_001
- DQ_CONS_002
- DQ_CONS_003
- DQ_CONS_004
- DQ_CONS_005
- DQ_CONS_006
- DQ_CONS_009
- DQ_CONS_012
- DQ_RECON_005
- DQ_REF_001
- DQ_REF_008
- DQ_TIME_003
- DQ_UNIQ_004
- DQ_VALID_013
depends_on_mappings:
- ref_country_mapping
- ref_department_mapping
minimum_n: 20
response_levels:
  FATO: liberado
  CONTEXTO: liberado; associacao e sempre nomeada como associacao
  INTERPRETACAO: bloqueado ate haver regra registrada no contrato, com dono
  CAUSALIDADE: negado por padrao (ADR-0015); sem estudo registrado nao ha resposta causal
interpretation_rules: []
causal_studies: []
