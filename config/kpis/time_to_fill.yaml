# Contrato do KPI `time_to_fill` (ADR-0011).
#
# `depends_on_checks` NAO e digitado: e derivado de `consumed_by_kpis` no
# catalogo de checks, e o teste test_contrato_de_kpi_bate_com_o_catalogo
# reprova se as duas pontas divergirem.
#
# `minimum_n` e a supressao do ADR-0007: abaixo dele o recorte nao responde,
# e a recusa e por privacidade, nao por qualidade.
#
# --- F7 ---------------------------------------------------------------------
# `status` e `certification` NAO sao calculaveis a partir do trust score
# (ADR-0029). CERTIFIED e aprovacao humana registrada, com dono e data.
# Promover porque o dado melhorou e o mesmo erro que a F4 proibe na promocao
# automatica de mapeamento.
#
# `interpretation_rules` vazio significa INTERPRETACAO BLOQUEADA. Nao preencher
# para destravar o nivel: sem banda ou meta assinada, nao ha o que interpretar.
kpi_id: time_to_fill
name: Tempo para preencher
description: Dias entre abertura da requisicao e admissao.
business_definition: Mediana de dias entre a abertura da requisicao e a admissao, entre as
  requisicoes cujo marco de admissao ocorreu.
formula: mediana de (data de admissao menos data de abertura da requisicao)
grain: trimestre x business unit
population: requisicoes com admissao registrada
period_grain: trimestre
period_rollup: soma
period_coverage:
  from: 2021-Q1
  to: 2026-Q2
allowed_dimensions:
- pais
- business_unit
- departamento
- nivel
filters:
- regra: date_sk_hire > 0
  porque: marco nao atingido e membro nomeado (-5), nao nulo a ignorar
exclusions:
- o_que: requisicoes com status Cancelled
  porque: nunca foram preenchidas
- o_que: date_sk_hire = -5 (ainda nao ocorreu)
  porque: requisicao aberta nao tem tempo de preenchimento
source_tables:
- dim_calendar
- dim_job_level
- dim_organization
- fact_requisition
coverage: null
owner: people-analytics
version: 1.0.0
status: CERTIFIED
certification:
  approved_by: people-analytics
  approved_at: '2026-09-12'
  blockers: []
depends_on_checks:
- DQ_CONS_010
- DQ_CONS_013
- DQ_RECON_007
- DQ_REF_004
- DQ_UNIQ_005
depends_on_mappings:
- ref_department_mapping
minimum_n: 5
response_levels:
  FATO: liberado
  CONTEXTO: liberado; associacao e sempre nomeada como associacao
  INTERPRETACAO: bloqueado ate haver regra registrada no contrato, com dono
  CAUSALIDADE: negado por padrao (ADR-0015); sem estudo registrado nao ha resposta causal
interpretation_rules: []
causal_studies: []
