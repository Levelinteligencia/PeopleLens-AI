# Contrato do KPI `compa_ratio` (ADR-0011).
#
# `depends_on_checks` NAO e digitado: e derivado de `consumed_by_kpis` no
# catalogo de checks, e o teste test_contrato_de_kpi_bate_com_o_catalogo
# reprova se as duas pontas divergirem.
#
# `minimum_n` e a supressao do ADR-0007: abaixo dele o recorte nao responde,
# e a recusa e por privacidade, nao por qualidade.
#
# --- F7 ---------------------------------------------------------------------
# `status` e `certification` NAO sao calculaveis a partir do trust score
# (ADR-0029). CERTIFIED e aprovacao humana registrada, com dono e data.
# Promover porque o dado melhorou e o mesmo erro que a F4 proibe na promocao
# automatica de mapeamento.
#
# `interpretation_rules` vazio significa INTERPRETACAO BLOQUEADA. Nao preencher
# para destravar o nivel: sem banda ou meta assinada, nao ha o que interpretar.
kpi_id: compa_ratio
name: Compa-ratio
description: Salario sobre o ponto medio da banda.
business_definition: Salario base sobre o ponto medio da faixa salarial do nivel.
formula: mediana de (salario base dividido pelo midpoint da banda do nivel)
grain: mes x pais x nivel
population: pessoas com salario e faixa do nivel
period_grain: mes
period_rollup: ultimo_periodo
period_coverage: null
allowed_dimensions:
- pais
- nivel
- business_unit
filters: []
exclusions: []
source_tables:
- fact_compensation
- dim_employee
- dim_job_level
coverage: null
owner: people-analytics
version: 1.0.0
status: BLOCKED
certification:
  approved_by: null
  approved_at: null
  blockers:
  - motivo: 'nao existe banda salarial fora da camada de verdade: ref_salary_band so esta
      em data/synthetic/truth/. Le-la e exatamente o que o teste F-13 da F6 proibe.'
    resolvido_por: COMP_PLAN na onda 2, ou uma faixa salarial de referencia governada fora
      da camada de verdade
depends_on_checks:
- DQ_COMP_011
- DQ_CONS_003
- DQ_CONS_014
- DQ_CONS_016
- DQ_RECON_006
- DQ_REF_008
- DQ_REF_009
- DQ_REF_011
- DQ_TIME_002
- DQ_TIME_004
- DQ_VALID_006
- DQ_VALID_010
- DQ_VALID_017
depends_on_mappings:
- ref_job_level_mapping
- ref_country_mapping
minimum_n: 5
response_levels:
  FATO: liberado
  CONTEXTO: liberado; associacao e sempre nomeada como associacao
  INTERPRETACAO: bloqueado ate haver regra registrada no contrato, com dono
  CAUSALIDADE: negado por padrao (ADR-0015); sem estudo registrado nao ha resposta causal
interpretation_rules: []
causal_studies: []
