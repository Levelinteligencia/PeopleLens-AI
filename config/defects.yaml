    source_systems: [VIVAMARKET_LEGACY, COMPRAFACIL_ERP, ATS_CLOUD]
    scope: {on_initial_load: true}
    rate: 1.00
    resolved_by: xref_employee_identity
    detected_by: [DQ_COMP_001]

  - id: D06
    name: "employee_id duplicado entre sistemas"
    dimension: Uniqueness
    kind: structural
    root_cause_incident: INC_2022_VIVAMARKET
    description: "Colisao de faixa numerica entre os IDs da VivaMarket e os do HRIS_CORE"
    source_systems: [VIVAMARKET_LEGACY, HRIS_CORE]
    scope: {absolute_count: 180}
    rate: null
    rate_type: absolute
    detected_by: [DQ_UNIQ_002]

  - id: D07
    name: "Formato de data divergente"
    dimension: Validity
