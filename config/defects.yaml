    detected_by: [DQ_VALID_009]

  # ---------------------------------------------------------------------------
  # Defeito estrutural sem numero, por ser mudanca de definicao e nao erro
  # ---------------------------------------------------------------------------
  - id: D_DEFINITION_DRIFT
    name: "Deriva de definicao ao longo do tempo"
    dimension: Consistency
    kind: semantic
    root_cause_incident: [INC_2021_PERF_SCALE, INC_2025_NEW_ORG_MODEL]
    description: >
      Nao e defeito de digitacao nem de sistema: a organizacao mudou o
      significado de um campo. Exige DE/PARA temporal e afeta toda comparacao
      historica.
    source_systems: [HRIS_CORE, HRIS_LEGACY, COMP_PLAN]
    affected_fields: [performance_rating, job_level, business_unit, cost_center]
    requires_mapping: [ref_performance_rating_mapping, ref_job_level_mapping, ref_business_unit_mapping, ref_cost_center_mapping]
    detected_by: [DQ_CONS_010]

# -----------------------------------------------------------------------------
# O que NAO fazer  (Especificacao secao 25)
# -----------------------------------------------------------------------------
forbidden_injection_patterns:
  - "nulos distribuidos uniformemente sem causa"
  - "corrupcao aleatoria de valores sem sistema de origem"
  - "defeito que nao aponta para um incidente ou uma pratica declarada"
  - "taxa escolhida sem estar neste arquivo"
