# =============================================================================
# PeopleLens AI  ::  NOVAORA
# config/defects.yaml
#
# Catalogo de defeitos deliberados. Todo defeito tem causa raiz declarada,
# escopo e sistema de origem. Nada de randomly_make_10_percent_null().
#
# ESTADO DA DECISAO D8  (ADR-0008):
#   Parte A, ESTRUTURA deste catalogo: APROVADA, com a Emenda 1 de 11/09/2026
#   (reconciliacao com sources.yaml: D01, D04, D05 e D_DEFINITION_DRIFT ganharam
#   os sistemas que sources.yaml ja declarava).
#   Parte B, TAXAS numericas: PROVISORIAS ate a F7. Emenda 2 de 11/09/2026: os
#   criterios de saida dependem do trust score, que so existe na F7, entao o
#   congelamento acontece la e nao ao final da F2.
#
# Referencia: Technical Design v0.3 secao 8. Especificacao secao 25.
# Status: F0. Nenhum dado foi gerado a partir deste arquivo.
# =============================================================================

meta:
  config_version: "0.2"
  phase: F2
  rates_status: PROVISIONAL          # muda para FROZEN na F7 (ADR-0008, Emenda 2)
  freeze_phase: F7
  frozen_at: null
  frozen_in_adr: null
  part_a_amendments:
    - {id: 1, date: 2026-09-11, summary: "reconciliacao com sources.yaml em D01, D04, D05 e D_DEFINITION_DRIFT"}

# -----------------------------------------------------------------------------
# Alvo de calibragem  (ADR-0008)
# -----------------------------------------------------------------------------
# As taxas NAO sao escolhidas por realismo isolado. Realismo e restricao,
# a distribuicao abaixo e o objetivo. Medida sobre o conjunto de combinacoes
# (KPI x recorte) na camada semantica.
calibration:
  method: "iterativa, com perfil de escala dev (10%)"
  # A F2 verifica a calibragem TECNICA (taxa realizada versus esperada por
  # defeito, sistema e dataset). A calibragem contra a distribuicao de trust
  # score acontece na F7, quando o trust score existir. Ver ADR-0008 Emenda 2.
  technical_calibration_phase: F2
  trust_calibration_phase: F7
  # DQ-04 (fechamento da F5, ADR-0023): a calibragem da F7 acontece por RECORTE
  # FINO, e as bandas de trust score NAO se movem. Se, com recorte fino, a
  # distribuicao continuar fora da faixa, e a faixa alvo abaixo que e revista
  # com evidencia, e nao os limiares do score.
  trust_calibration_strategy: "recorte fino; bandas preservadas (ADR-0023)"
  target_trust_distribution:
    CERTIFIED: [0.60, 0.70]
    LIMITED:   [0.20, 0.25]
    BLOCKED:   [0.10, 0.15]
  target_concentration:
    CERTIFIED: "Brasil e Corporate, 2021 em diante"
    LIMITED:   "janela da migracao de 2019, paises menores"
    BLOCKED:   "populacoes VivaMarket e CompraFacil, e o periodo 2016 a 2018"
  most_sensitive_rates:
    - {defect: D03, reason: "governa todos os KPIs de DEI e interage com o n minimo do ADR-0007"}
    - {defect: D11, reason: "governa a reconciliacao, o check mais visivel na demonstracao. Abaixo de 2% ninguem percebe; acima de 8% parece erro de implementacao"}
  exit_criteria:
    - "distribuicao de trust score dentro das faixas alvo"
    - "fila de exceptions com pelo menos 40 valores distintos abertos no primeiro processamento"
    - "pelo menos um KPI CERTIFIED e um BLOCKED respondiveis pela mesma pergunta em recortes diferentes"
    - "quarentena nao vazia e abaixo de 3% do volume total"

# -----------------------------------------------------------------------------
# Severidades de injecao
# -----------------------------------------------------------------------------
severity_legend:
  structural: "impede o registro de entrar no analitico; vai para quarentena"
  semantic:   "registro entra, mas exige DE/PARA ou derruba trust score"
  cosmetic:   "afeta forma, nao significado; resolvido na camada standardized"

# -----------------------------------------------------------------------------
# Defeitos
# -----------------------------------------------------------------------------
defects:

  - id: D01
    name: "Dominio de gender divergente"
    dimension: Consistency
    kind: semantic
    root_cause_incident: INC_2019_HRIS_MIGRATION
    description: "M/F no legado convivendo com Male/Female no novo HRIS durante a janela de migracao"
    source_systems: [HRIS_LEGACY, HRIS_CORE, VIVAMARKET_LEGACY]   # VivaMarket usa MASC/FEM
    scope: {date_range: [2019-05-01, 2019-11-30]}
    rate: 1.00
    rate_basis: "100% dos registros do periodo de sobreposicao"
    requires_mapping: ref_gender_mapping
    detected_by: [DQ_VALID_004, DQ_CONS_002]

  - id: D02
    name: "race_ethnicity inexistente"
    dimension: Completeness
    kind: semantic
    root_cause_incident: INC_2019_HRIS_MIGRATION
    description: "O campo nao existia antes de jun/2019. Nao e dado faltante, e ausencia de campo"
    source_systems: [HRIS_LEGACY]
    scope: {date_range: [2016-01-01, 2019-05-31]}
    rate: 1.00
    note: "O KPI de representatividade nao deve retornar zero para este periodo, deve retornar indisponivel"
    detected_by: [DQ_COMP_007]

  - id: D03
    name: "race_ethnicity nao informada"
    dimension: Completeness
    kind: semantic
    root_cause: "autodeclaracao opcional"
    source_systems: [HRIS_CORE]
    scope: {date_range: [2019-06-01, 2026-06-30]}
    rate_by_country: {BR: 0.24, AR: 0.31, CL: 0.29, CO: 0.26, MX: 0.35}
    rate_status: PROVISIONAL_SENSITIVE
    note: >
      Taxa mais sensivel do catalogo. Define o denominador de todos os KPIs de
      DEI. A regra e reportar sobre a base de declarantes e informar a taxa de
      nao declaracao junto, nunca imputar.
    detected_by: [DQ_COMP_008]

  - id: D04
    name: "Departamento com nomenclatura livre"
    dimension: Consistency
    kind: semantic
    root_cause: "entrada manual sem dominio controlado"
    source_systems: [HRIS_LEGACY, VIVAMARKET_LEGACY]
    scope: {date_range: [2016-01-01, 2019-11-30]}
    rate: 0.12
    variants_example: ["RH", "R.H.", "Recursos Humanos", "rh", "REC HUMANOS", "People & Culture"]
    requires_mapping: ref_department_mapping
    detected_by: [DQ_CONS_001]

  - id: D05
    name: "employee_id corporativo ausente"
    dimension: Completeness
    kind: structural
    root_cause_incident: [INC_2022_VIVAMARKET, INC_2024_COMPRAFACIL]
    description: "Sistemas de aquisicao nao conhecem o ID corporativo da NOVAORA"
    # ATS_CLOUD entra aqui porque o `enterprise_id_fill_rate: 0.63` declarado em
