    - {name: DEI,               mandatory: true,  hours: [1, 3],  from_year: 2021}
    - {name: Leadership,        mandatory: false, hours: [8, 40], level_groups: [Manager, "Senior Manager", Director, Executive]}
    - {name: Management,        mandatory: false, hours: [4, 20], level_groups: [Manager, "Senior Manager"]}
    - {name: Technology,        mandatory: false, hours: [4, 60], segments: [digital, corporate]}
